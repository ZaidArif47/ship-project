<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generated Report</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>AI Generated Report</h1>
    </header>
    <main>
        <section id="report-content">
            <!-- AI report content will be dynamically inserted here -->
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Ship Project. All rights reserved.</p>
    </footer>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Fetch and display the AI report
        async function fetchReport() {
            try {
                const response = await fetch('/api/ai/report'); // Adjust the endpoint as necessary
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const reportData = await response.json();
                document.getElementById('report-content').innerHTML = reportData.content; // Adjust based on actual data structure
            } catch (error) {
                console.error('Error fetching report:', error);
                document.getElementById('report-content').innerHTML = '<p>Error loading report. Please try again later.</p>';
            }
        }

        // Call the function to fetch the report when the page loads
        window.onload = fetchReport;
    </script>
</body>
</html>
